code: EG
name: Egypt
native_name: مصر
region: Africa
languages: [ar, en]
updated: 2026-11-05
research: research/example-identifiers-africa.md
summary: >
  The SWIFT IBAN Registry gives an official example Egyptian IBAN. The Egyptian Tax
  Authority's e-invoicing system uses its own JSON/XML format (not UBL); its SDK and
  Postman collection contain generic names and an EGS item code. The taxpayer
  registration numbers in those samples (e.g. 674859545) are probably pre-production
  test taxpayers but could not be verified (no open lookup) and are left out. No
  reserved phone range, national ID specimen or fictitious postcode exists; the
  national ID check digit algorithm is not published. Do not invent Egyptian phone numbers.

identifiers:
  - name: Tax registration number (RIN)
    format: 9 digits (printed 000-000-000 on the tax card)
    authority: Egyptian Tax Authority (ETA)
    notes: Also the e-invoice issuer ID. No published check digit.
    ubl: ["cac:PartyTaxScheme/cbc:CompanyID"]
  - name: National ID number (الرقم القومي)
    format: 14 digits — century (2 = 1900s, 3 = 2000s) + YYMMDD + 2-digit governorate + 4-digit serial (13th digit odd = male) + check digit
    authority: Civil Status Organization
    notes: Governorate 01 Cairo, 02 Alexandria, 21 Giza, 88 born abroad. The check digit algorithm is not published.
  - name: EGS item code
    format: EG-<RIN>-<internal code>
    authority: ETA
    ubl: ["cac:Item/cac:SellersItemIdentification/cbc:ID"]
  - name: IBAN
    format: EG + 2 check digits + 25 digits (29 characters)
    check: iban
    authority: Central Bank of Egypt
    ubl: ["cac:PayeeFinancialAccount/cbc:ID"]

entries:
  # --- Organisation ---------------------------------------------------------
  - id: eg-name-issuer-company
    category: organisation
    type: Company name
    value: Issuer Company
    label: Issuer name in the ETA e-invoicing SDK samples
    status: published-example
    notes: Other names used are الشركة المصدرة ("the issuing company"), Receiver, taxpayer 1 and My company.
    ubl: ["cac:PartyLegalEntity/cbc:RegistrationName"]
    sources: &eta
      - title: ETA eInvoicing SDK R3.0 — Postman collection
        url: https://sdk.invoicing.eta.gov.eg/files/Egyptian%20eInvoicing%20SDK.postman_collection.json
        publisher: Egyptian Tax Authority
        accessed: 2026-11-05
      - title: ETA eInvoicing SDK — Invoice v1.0
        url: https://sdk.invoicing.eta.gov.eg/documents/invoice-v1-0/
        publisher: Egyptian Tax Authority
        accessed: 2026-11-05
  - id: eg-activity-4620
    category: organisation
    type: Activity code
    value: "4620"
    label: Taxpayer activity code (ISIC-based) in the ETA samples
    status: published-example
    sources: *eta

  # --- Address ----------------------------------------------------------------
  - id: eg-address-eta-dokki
    category: address
    type: Address example (e-invoice)
    kind: placeholder
    value: "Giza Governorate / Dokki / 17 Nabil Al Wakad / building 17"
    label: Issuer address in the ETA Invoice v1.0 documentation
    status: published-example
    notes: Real street in Dokki, Giza. Fields governate / regionCity / street / buildingNumber.
    sources:
      - title: ETA eInvoicing SDK — Invoice v1.0
        url: https://sdk.invoicing.eta.gov.eg/documents/invoice-v1-0/
        publisher: Egyptian Tax Authority
        accessed: 2026-11-05
  - id: eg-address-upu-giza
    category: address
    type: Address example (street)
    kind: placeholder
    value: "Mohamed Ahmed Mahmoud / 30 Moussa Galal street / Al-Mohandessine / GIZA / 3759914"
    label: UPU example of a street address
    status: published-example
    notes: Real places. 7-digit postcode below the province.
    sources: &upu-eg
      - title: UPU Postal addressing systems — Egypt (07/2023)
        url: https://www.upu.int/UPU/media/upu/PostalEntitiesFiles/addressingUnit/egyEn.pdf
        publisher: Universal Postal Union
        accessed: 2026-11-05
  - id: eg-address-upu-new-valley
    category: address
    type: Address example (village)
    kind: placeholder
    value: "4 El-Mehata street - El-Zohor Village / Ville El-kharga / NEW VALLEY / 1062261"
    label: UPU example of a village address
    status: published-example
    sources: *upu-eg

  # --- Banking -------------------------------------------------------------------
  - id: eg-iban-swift-registry
    category: banking
    type: IBAN
    value: EG38 0019 0005 0000 0000 2631 8000 2
    label: Official example IBAN for Egypt in the SWIFT IBAN Registry
    status: published-example
    checks: [iban]
    notes: Bank code 0019 and branch 0005 are probably real; the account part is fictitious.
    ubl: ["cac:PayeeFinancialAccount/cbc:ID"]
    sources:
      - title: SWIFT IBAN Registry (ISO 13616 Registration Authority)
        url: https://www.swift.com/resource/iban-registry-pdf
        publisher: SWIFT
        accessed: 2026-11-05

  # --- Trade ---------------------------------------------------------------------
  - id: eg-egs-113317713-123456
    category: trade
    type: EGS item code
    value: EG-113317713-123456
    label: Internal item code in the ETA e-invoicing samples
    status: published-example
    notes: Structure EG-<RIN>-<internal code>.
    ubl: ["cac:Item/cac:SellersItemIdentification/cbc:ID"]
    sources: *eta

  # --- Avoid ---------------------------------------------------------------------
  - id: eg-avoid-rin-10201020102
    category: organisation
    type: Tax registration number (RIN)
    value: "10201020102"
    label: Registration number in the ETA field documentation
    status: avoid
    reason: 11 digits; does not match the 9-digit RIN format.
    sources: *eta
  - id: eg-avoid-name-alpha-bank
    category: banking
    type: Bank name
    value: Alpha Bank
    label: Bank name example in the ETA documentation
    status: avoid
    reason: Real bank.
    sources: *eta
  - id: eg-avoid-phone-201020567462
    category: contact
    type: Phone number
    value: "+201020567462"
    label: Buyer mobile number in the ETA e-receipt sample
    status: avoid
    reason: Valid Egyptian mobile number, possibly held by a real person.
    sources:
      - title: ETA eInvoicing SDK
        url: https://sdk.invoicing.eta.gov.eg/
        publisher: Egyptian Tax Authority
        accessed: 2026-11-05
  - id: eg-avoid-gtin-037000401629
    category: trade
    type: GTIN
    value: "037000401629"
    label: Item GTIN in the ETA e-receipt sample (with "Samsung A02 32GB…")
    status: avoid
    checks: [gs1]
    reason: Real GS1 company prefix and real product. Use a GS1 952 prefix.
    sources:
      - title: ETA eInvoicing SDK
        url: https://sdk.invoicing.eta.gov.eg/
        publisher: Egyptian Tax Authority
        accessed: 2026-11-05
  - id: eg-avoid-address-postman
    category: address
    type: Address example
    kind: placeholder
    value: 580 Clementina Key, 7660 Melody Trail, 68030
    label: Street and postcode strings in the ETA Postman collection
    status: avoid
    reason: Faker-generated US-style text; not Egyptian, and the postcode does not match the 7-digit system.
    sources:
      - title: ETA eInvoicing SDK R3.0 — Postman collection
        url: https://sdk.invoicing.eta.gov.eg/files/Egyptian%20eInvoicing%20SDK.postman_collection.json
        publisher: Egyptian Tax Authority
        accessed: 2026-11-05
