code: BR
name: Brazil
native_name: Brasil
region: Latin America
languages: [pt, en]
updated: 2026-11-05
research: research/example-identifiers-south-america.md
summary: >
  Brazil has strong official material: Receita Federal's worked example for the new
  alphanumeric CNPJ (12.ABC.345/01DE-35) passes the check digits and is not in the
  register, Serpro publishes 22 "CPF fictícios" for its API trial, and the NF-e
  homologação environment reserves a CNPJ (99.999.999/0001-91) and mandatory test texts.
  Serpro's numeric "fictitious" CNPJs, however, belong to real companies. Brazil does not
  use UBL or Peppol (national NF-e/CT-e/NFS-e XML). Anatel reserves no telephone numbers
  for fiction, so leave phones out. State IE (Inscrição Estadual) examples from SINTEGRA
  were not checked against state registers and are not listed.

identifiers:
  - name: CNPJ (Cadastro Nacional da Pessoa Jurídica)
    format: 14 characters, 8-character root + 4-character branch (0001 = head office) + 2 numeric check digits; written NN.NNN.NNN/NNNN-NN
    check: br-cnpj
    authority: Receita Federal do Brasil
    notes: Mod 11 (weights 5-4-3-2-9-8-7-6-5-4-3-2, then 6-5-4-3-2-9-8-7-6-5-4-3-2; remainder < 2 → 0). From July 2026 the first 12 positions may be A–Z (value = ASCII − 48), IN RFB 2.229/2024; numeric CNPJs stay valid.
  - name: CPF (Cadastro de Pessoas Físicas)
    format: 11 digits, 9 base digits + 2 mod-11 check digits; written NNN.NNN.NNN-NN
    check: br-cpf
    authority: Receita Federal do Brasil
    notes: The 9th digit is the fiscal region. There is no open CPF register lookup.
  - name: Inscrição Estadual (IE)
    format: Varies by state (length and check-digit routine published on SINTEGRA)
    authority: State tax administrations (SEFAZ)
    notes: Empty for non-contributors (indIEDest = 9); the literal ISENTO is used for IE-exempt contributors.
  - name: CEP (postcode)
    format: NNNNN-NNN, alone on the last address line, without the word "CEP" and without dots
    authority: Correios
  - name: Pix key
    format: CPF, CNPJ, e-mail, phone (+55…) or random key (EVP, UUID)
    authority: Banco Central do Brasil

