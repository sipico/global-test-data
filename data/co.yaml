    category: person
    type: Consumer ID (consumidor final)
    value: "222222222222"
    label: Reserved ID for the anonymous final consumer in e-invoices
    status: reserved
    notes: >
      12 × 2, identification type 13, AdditionalAccountID 2, name "consumidor final", email optional
      (Anexo Técnico rules FAK61/FAK62 and the CreditNote/DebitNote equivalents). Legal meaning, not a test value.
    ubl: ['cac:AccountingCustomerParty/cac:Party/cac:PartyTaxScheme/cbc:CompanyID @schemeName=13']
