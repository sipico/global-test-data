  # --- Address ----------------------------------------------------------------
  - id: co-address-av-123-45-67
    category: address
    type: Street address
    kind: placeholder
    value: "AV 123 # 45 - 67"
    label: Address placeholder used in the DIAN example XMLs
    status: published-example
    notes: Colombian style street type + number + # + cross-street number − house number. No official fictitious address exists (none at 4-72). Calle 000 is also used (consumer example).
    ubl: ['cac:Address/cac:AddressLine/cbc:Line']
    sources: *dian
  - id: co-postcode-110111
    category: address
    type: Postcode
    value: "110111"
    label: Most frequent postcode in the DIAN examples (Usaquén, Bogotá)
    status: published-example
    notes: Real postcode; combine with an invented street. Bogotá is city code 11001, department 11.
    ubl: ['cac:Address/cbc:PostalZone']
    sources: &postal
      - title: DIAN — Caja de herramientas FE V1.9 (v2026), table 13.4.4 postcodes
        url: https://www.dian.gov.co/impuestos/factura-electronica/Documents/Caja-de-herramientas-FE_V19_v2026.zip
