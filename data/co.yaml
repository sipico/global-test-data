summary: >
  Colombia's electronic invoice is UBL 2.1. The DIAN toolkit ships 44 signed example XMLs
  that are an excellent structural reference, but most party NITs in them are real
  companies, including DIAN's own NIT. Only a handful of DIAN example NITs pass the check
  digit and are not in the RUES chamber-of-commerce register; they were not checked in the
  DIAN RUT (captcha), and RUES does not cover every taxpayer. The anonymous consumer has a
  reserved ID (222222222222). There is no reserved telephone range, no official fictitious
  address and no national bank-account check digit. Not included: the exógena seudo-NITs
  444444xxx (source article not found) and the cédula numbers in the DIAN examples
  (Registraduría not checked).

identifiers:
  - name: NIT (Número de Identificación Tributaria)
    format: 9 digits for legal entities (blocks 800…, 830…, 860…, 890…, 900…, 901…) + 1 check digit (DV); individuals use their cédula as NIT
    check: co-nit
    authority: DIAN
    notes: >
      DV: weights from the right 3 7 13 17 19 23 29 37 41 43 47 53 59 67 71; r = sum mod 11;
      DV = r if r is 0 or 1, else 11 − r. In the DIAN UBL 2.1 e-invoice the NIT goes without the DV,
      with schemeName = identification type (31 = NIT), schemeID = DV and schemeAgencyID = 195 (DIAN).
    ubl: ['cac:PartyTaxScheme/cbc:CompanyID @schemeName=31 @schemeID=<DV> @schemeAgencyID=195', 'cac:PartyLegalEntity/cbc:CompanyID @schemeName=31 @schemeID=<DV> @schemeAgencyID=195']
  - name: Cédula de ciudadanía
    format: 6–10 digits, no check digit
    authority: Registraduría Nacional del Estado Civil
    notes: Cannot be validated offline; do not invent one. DIAN identification type 13.
    ubl: ['cac:PartyTaxScheme/cbc:CompanyID @schemeName=13']
  - name: CUFE (Código Único de Factura Electrónica)
    format: 96 hexadecimal characters (SHA-384 over invoice number, date, amounts, taxes, NITs, technical key and environment)
    authority: DIAN
    ubl: ['cbc:UUID @schemeName=CUFE-SHA384 @schemeID=<environment>']
  - name: Código postal
    format: 6 digits — DANE department (2) + routing zone (2; 00 = department capital) + postal district (2)
    authority: 4-72 (Servicios Postales Nacionales)
    notes: An unknown PostalZone only gives a warning in DIAN validation (rule FAJ73), not a rejection.
    ubl: ['cac:Address/cbc:PostalZone']

