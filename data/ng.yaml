code: NG
name: Nigeria
native_name: Nigeria
region: Africa
languages: [en]
updated: 2026-11-05
research: research/example-identifiers-africa.md
summary: >
  The Central Bank of Nigeria's NUBAN documents contain worked examples of the account
  number check digit, which are the safest Nigerian values found (the bank codes are
  real). The national e-invoicing system (NRS, formerly FIRS) calls itself UBL- and
  Peppol-based, but its API takes a JSON derived from UBL, not UBL XML. Its samples use
  real or invalid data in many places; the TINs in its field documentation
  (e.g. 89487982-0001) and the generic names (ABC Cement Ltd …) were not checked
  against the registers and are left out. No reserved phone range, test NIN/BVN or
  fictitious postcode exists; do not invent Nigerian phone numbers.

identifiers:
  - name: Tax Identification Number (TIN)
    format: 8 digits + hyphen + 4 digits (NNNNNNNN-NNNN)
    authority: Nigeria Revenue Service (NRS, formerly FIRS) / Joint Tax Board
    notes: No published check digit. From January 2026 the NIN (individuals) and the CAC RC number (companies) serve as tax ID.
    ubl: ["cac:PartyTaxScheme/cbc:CompanyID"]
  - name: CAC registration number
    format: RC + digits (companies), BN + digits (business names), IT + digits (incorporated trustees)
    authority: Corporate Affairs Commission (CAC)
    notes: No check digit.
    ubl: ["cac:PartyLegalEntity/cbc:CompanyID"]
  - name: National Identification Number (NIN)
    format: 11 digits
    authority: National Identity Management Commission (NIMC)
    notes: No published check digit and no official test value.
  - name: Bank Verification Number (BVN)
    format: 11 digits
    authority: Nigeria Inter-Bank Settlement System (NIBSS)
    notes: No official test value.
  - name: NUBAN account number
    format: 10 digits (9-digit serial + check digit), tied to a 3-digit bank code or 6-digit institution code
    check: ng-nuban
    authority: Central Bank of Nigeria (CBN)
    notes: Weights 3,7,3,3,7,3,… over the 6-digit institution code (bank 011 → 000011) + serial; check = (10 − sum mod 10) mod 10. The ng-nuban validator takes '<3-digit bank code>:<account>'.
    ubl: ["cac:PayeeFinancialAccount/cbc:ID"]
  - name: Invoice Reference Number (IRN)
    format: <invoice number>-<8-character service ID>-<YYYYMMDD>
    authority: NRS

entries:
  # --- Address ----------------------------------------------------------------
  - id: ng-address-upu-ibadan
    category: address
    type: Address example (company)
    kind: placeholder
    value: "Mr. Bukwa Okoro / Okukwo Nigeria Ltd / 34 Alayande Cl / Mokola 200212 / Ibadan / OYO STATE"
    label: UPU example of a company street address
    status: published-example
    notes: Real locality and postcode; postcode follows the locality on the same line. The company name was not checked against CAC, so replace it with a fictitious name.
    sources: &upu-ng
      - title: UPU Postal addressing systems — Nigeria (10/2022)
        url: https://www.upu.int/UPU/media/upu/PostalEntitiesFiles/addressingUnit/ngaEn.pdf
        publisher: Universal Postal Union
        accessed: 2026-11-05
  - id: ng-address-upu-abuja
    category: address
    type: Address example (P.O. Box)
    kind: placeholder
    value: "Mr Bukwa Okoro Kola / Adelboden Ltd / P.O.Box. 125 / Garki 900001 / ABUJA"
    label: UPU example of a P.O. Box address
    status: published-example
    notes: Real locality and postcode; company name not checked against CAC.
    sources: *upu-ng

  # --- Banking -------------------------------------------------------------------
  - id: ng-nuban-011-0000014579
    category: banking
    type: NUBAN account number
    value: "011:0000014579"
    label: CBN worked example of a bank account number (bank 011)
    status: published-example
    checks: [ng-nuban]
    notes: Account number 0000014579 at bank code 011 (First Bank, a real bank); check-digit sum 81 → 9. A real account with this number could exist.
    ubl: ["cac:PayeeFinancialAccount/cbc:ID"]
    sources:
      - title: CBN Exposure circular on NUBAN (2018)
        url: https://www.cbn.gov.ng/out/2018/psmd/exposure%20circular%20for%20nuban.pdf
        publisher: Central Bank of Nigeria
        accessed: 2026-11-05
  - id: ng-nuban-950547-0000214579
    category: banking
    type: NUBAN account number (other financial institution)
    value: "950547:0000214579"
    label: CBN worked example of an account at an other financial institution
    status: published-example
    notes: Account number 0000214579 at institution code 950547; check-digit sum 211 → 9 per CBN. The ng-nuban validator handles only 3-digit bank codes, so this value is not machine-checked.
    ubl: ["cac:PayeeFinancialAccount/cbc:ID"]
    sources:
      - title: CBN Exposure circular on NUBAN (2018)
        url: https://www.cbn.gov.ng/out/2018/psmd/exposure%20circular%20for%20nuban.pdf
        publisher: Central Bank of Nigeria
        accessed: 2026-11-05
  - id: ng-nuban-011-0000000220
    category: banking
    type: NUBAN account number
    value: "011:0000000220"
    label: Example account number in the 2010 NUBAN proposals (bank 011)
    status: published-example
    checks: [ng-nuban]
    notes: Account number 0000000220, check digit 0. Bank code 011 is real.
    ubl: ["cac:PayeeFinancialAccount/cbc:ID"]
    sources:
      - title: CBN NUBAN proposals v0.4 (2010)
        url: https://www.cbn.gov.ng/OUT/2011/CIRCULARS/BSPD/NUBAN%20PROPOSALS%20V%200%204-%2003%2009%202010.PDF
        publisher: Central Bank of Nigeria
        accessed: 2026-11-05

