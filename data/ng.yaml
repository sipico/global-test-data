  - id: ng-irn-itw001-e9e0c0d3-20240619
    category: document
    type: Invoice Reference Number (IRN)
    value: ITW001-E9E0C0D3-20240619
    label: IRN in the NRS e-invoicing API documentation
    status: published-example
    ubl: ["cbc:ID"]
    sources: &nrs
      - title: NRS e-Invoicing developer documentation
        url: https://einvoice.nrs.gov.ng/docs/introduction
        publisher: Nigeria Revenue Service
        accessed: 2026-11-05
  - id: ng-irn-inv001-e9e0c0d3-20240619
    category: document
    type: Invoice Reference Number (IRN)
    value: INV001-E9E0C0D3-20240619
    label: Second IRN in the NRS e-invoicing API documentation
    status: published-example
    ubl: ["cbc:ID"]
    sources: *nrs

  # --- Avoid ---------------------------------------------------------------------
  - id: ng-avoid-name-dangote
    category: organisation
    type: Company name
    value: Dangote Group
    label: Party name in the NRS API samples
    status: avoid
    reason: Real conglomerate.
    sources: *nrs
  - id: ng-avoid-tin-placeholder
    category: organisation
    type: TIN
    value: TIN-0099990001, TIN-000001
    label: Supplier and customer TINs in the NRS API samples
    status: avoid
    reason: Placeholders that do not match the Nigerian TIN format (8 + 4 digits).
    sources: *nrs
  - id: ng-avoid-email-email-com
    category: contact
    type: Email address
    value: supplier_business@email.com, business@email.com, paytest@email.com
    label: Email addresses in the NRS API samples
    status: avoid
    fails_checks: [reserved-domain]
    reason: email.com is a real mail provider. Use a .test domain.
    sources: *nrs
  - id: ng-avoid-phone-nrs
    category: contact
    type: Phone number
    value: +23480254099000, +23480254000000
    label: Phone numbers in the NRS API samples
    status: avoid
    reason: Wrong length (libphonenumber invalid). Nigeria has no reserved fictional range.
    sources: *nrs
  - id: ng-avoid-city-gwarikpa
    category: address
    type: Town and postcode
    value: Gwarikpa, 023401
    label: City and postcode in the NRS API samples
    status: avoid
    reason: Misspelling of Gwarinpa (Abuja); 023401 is not a known NIPOST postcode.
    sources: *nrs
  - id: ng-avoid-address-nicon
    category: address
    type: Address example (company)
    kind: placeholder
    value: NICON Insurance Corp. Plc, PMB 246 Garki
    label: Company address in the UPU addressing sheet
    status: avoid
    reason: Real company.
    sources: *upu-ng
  - id: ng-avoid-bvn-nin-sandbox
    category: person
    type: BVN / NIN
    value: 22222222222, 70123456789
    label: '"Test BVN/NIN" values in a third-party KYC sandbox'
    status: avoid
    reason: Provider-specific sandbox values (Dojah), not issued by NIBSS or NIMC; other systems may treat them as real numbers.
    sources:
      - title: Dojah — sandbox test data
        url: https://guides.dojah.io/user-manual/identity-verification/sandbox-test-data
        publisher: Dojah
        accessed: 2026-11-05
