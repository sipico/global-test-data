  # --- Address ----------------------------------------------------------------
  - id: ke-address-upu-nakuru
    category: address
    type: Address example (P.O. Box)
    kind: placeholder
    value: "MR. JOHN BWANA / P O BOX 2784 – NAKURU GPO / 20100 / NAKURU / KENYA"
    label: UPU example of a P.O. Box address
    status: published-example
    notes: Real post office and postcode (20100 Nakuru; 00100 is Nairobi GPO). The postcode is that of the delivery post office.
    sources:
      - title: UPU Postal addressing systems — Kenya (09/2004)
        url: https://www.upu.int/UPU/media/upu/PostalEntitiesFiles/addressingUnit/kenEn.pdf
        publisher: Universal Postal Union
        accessed: 2026-11-05

  # --- Contact -------------------------------------------------------------------
  - id: ke-phone-199
    category: contact
    type: Phone range
    kind: range
    value: +254 199 xxx xxx
    label: National destination code reserved for network testing
    status: reserved
    notes: '"Shared resource for internal use for purposes network testing, experimentations, and research." libphonenumber 9.0.42 rejects these numbers as invalid. There is no drama range; 021–029, 031–039 and 047–049 are only "reserved for future growth" and not safe.'
    sources:
      - title: Telecommunication Numbering Plan for Kenya (October 2025)
        url: https://www.ca.go.ke/sites/default/files/2025-10/Telecommunication%20Numbering%20Plan%20for%20Kenya%20October%202025[1].pdf
        publisher: Communications Authority of Kenya
        accessed: 2026-11-05

