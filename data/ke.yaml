code: KE
name: Kenya
native_name: Kenya
region: Africa
languages: [en, sw]
updated: 2026-11-05
research: research/example-identifiers-africa.md
summary: >
  The Kenya Revenue Authority uses the obviously fictitious PINs A123456789Z and
  P123456789Z throughout its eTIMS (OSCU/VSCU) specifications; the PIN check letter
  algorithm is not published, so only the format can be validated. The Communications
  Authority reserves the national destination code 199 for network testing, but
  libphonenumber rejects those numbers. eTIMS is a KRA-specific JSON API, not UBL.
  There is no fictitious town or postcode, no IBAN and no published bank account check
  digit. The M-Pesa test shortcode 174379 is widely documented but was not confirmed at
  the source, and the eTIMS customer name MTEJA LIMITED was not checked against the
  business register; both are left out.

identifiers:
  - name: KRA PIN
    format: A (individual) or P (non-individual) + 9 digits + check letter, 11 characters
    authority: Kenya Revenue Authority (KRA)
    notes: The check letter algorithm is not published. A secondary source says issued PINs start with A0 or P0 (unverified).
    ubl: ["cac:PartyTaxScheme/cbc:CompanyID"]
  - name: National ID number
    format: 7–8 digits (unverified)
    authority: National Registration Bureau
    notes: No published check digit and no official specimen.
  - name: Company registration number
    format: e.g. PVT-… (unverified)
    authority: Business Registration Service (BRS)
    notes: No known check digit; not researched further.
  - name: eTIMS branch ID (bhfId)
    format: 2 digits, 00 = head office
    authority: KRA

