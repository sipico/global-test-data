research: research/example-identifiers-china-hk-taiwan.md
summary: >
  Taiwan reserves no identifiers or telephone numbers for fiction, but the Ministry of
  Finance's worked examples for the 2023 Unified Business Number check rule give two
  valid UBNs that are in none of the three official registers. Several obvious
  placeholder UBNs (00000000, 99999997 …) and MOF's own first example belong to real
  businesses. The Ministry of the Interior's specimen ID card number deliberately fails
  the check digit, while the textbook A123456789 passes and is reportedly a real
  person's number. The MOF e-invoice test platform (wwwtest.einvoice.nat.gov.tw) issues
  test invoice tracks, but its official test UBNs could not be read (HTTP 403). No
  unused postcodes could be checked (the 3+3 file needs registration).

identifiers:
  - name: Unified Business Number (營利事業統一編號, UBN, 統編)
    format: 8 digits
    check: tw-ubn
    authority: Ministry of Finance
    notes: >-
      Weights 1 2 1 2 1 2 4 1; add the digits of each product. Since 2023-04-01 the sum
      must be divisible by 5 (previously 10); if the 7th digit is 7, sum or sum + 1 may
      be used. The old rule is a subset of the new one.
    ubl: ["cac:PartyLegalEntity/cbc:CompanyID", "cac:PartyTaxScheme/cbc:CompanyID"]
  - name: National ID (國民身分證統一編號)
    format: Letter (household registration city/county) + sex digit (1 male, 2 female) + 7 digits + check digit
    authority: Ministry of the Interior
    notes: >-
      Letter value A=10 … (I=34, O=35, W=32, X=30, Y=31, Z=33) split into two digits,
      weights 1 9 8 7 6 5 4 3 2 1 1, total divisible by 10 (check rule from secondary
      sources). No validator in tools/checks.py yet.
  - name: E-invoice track and number (字軌號碼)
    format: 2 capital letters + 8 digits, e.g. pattern AB12345678
    authority: Ministry of Finance (e-invoice platform)
    notes: >-
      National XML format MIG 4.0 (F0401, F0501 …), not UBL. Test tracks are issued per
      business on the test platform wwwtest.einvoice.nat.gov.tw; test data must not
      contain real personal or business data. Mobile barcode carrier CarrierType 3J0002,
      CarrierId 8 characters starting with /.
    ubl: ["cbc:ID"]
  - name: Postal code (郵遞區號)
    format: 3+3 digits (district + delivery section) since 2020-03-03; 3+2 still seen
    authority: Chunghwa Post
    notes: Written on line 1 above the address, no separator.
    ubl: ["cac:PostalAddress/cbc:PostalZone"]
  - name: Bank code
    format: 3-digit financial institution code + 4-digit branch code; no IBAN
    authority: Financial institutions (real codes only)

