  # --- Organisation ---------------------------------------------------------
  - id: tw-ubn-10458575
    category: organisation
    type: UBN
    value: "10458575"
    label: Worked example (7th digit 7, sum 20) in MOF's check-rule explanation
    status: published-example
    checks: [tw-ubn]
    verified: &tw-registers
      - Not in the MOF tax registration dataset BGMOPEN1, 1,715,523 rows (2026-11-05)
      - Not in the MOEA company register or business register (2026-11-05)
    notes: Valid under both the old (÷10) and the 2023 (÷5) rule.
    ubl: ["cac:PartyLegalEntity/cbc:CompanyID"]
    sources: &mof-ubn
      - title: 營利事業統一編號檢查碼邏輯修正說明（附件）
        url: https://www.trust.org.tw/upload/1100002250002.pdf
        publisher: Ministry of Finance (copy hosted by trust.org.tw)
        accessed: 2026-11-05
      - title: 統一編號檢查碼邏輯修正 (news)
