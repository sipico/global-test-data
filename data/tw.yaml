  # --- Contact -------------------------------------------------------------------
  - id: tw-email-placeholder-test
    category: contact
    type: Email address
    kind: placeholder
    value: invoice@<alias>.test
    label: Invoice email pattern on the reserved .test domain
    status: reserved
    checks: [reserved-domain]
    notes: Replace <alias> with a short alias for the party. No TWNIC-reserved example domain exists.
    ubl: ["cac:Contact/cbc:ElectronicMail"]
    sources: &rfc
      - title: RFC 2606 — Reserved Top Level DNS Names
        url: https://www.rfc-editor.org/rfc/rfc2606
        publisher: IETF
        accessed: 2026-11-05
      - title: RFC 6761 — Special-Use Domain Names
        url: https://www.rfc-editor.org/rfc/rfc6761
        publisher: IETF
        accessed: 2026-11-05

  # --- Banking -------------------------------------------------------------------
  - id: tw-bic-test-xxxxtwt0
    category: banking
    type: BIC
    value: XXXXTWT0
    label: Test BIC for Taiwan (8th character 0)
    status: reserved
    checks: [bic, bic-test]
    notes: ISO 9362 convention — '0' as second character of the location code marks a test BIC. No fictitious Taiwanese bank code exists.
    ubl: ["cac:FinancialInstitutionBranch/cbc:ID"]
    sources:
      - title: ISO 9362 (Wikipedia)
        url: https://en.wikipedia.org/wiki/ISO_9362
        publisher: Wikipedia
        accessed: 2026-11-05

  # --- Person --------------------------------------------------------------------
  - id: tw-national-id-specimen-a234567890
    category: person
    type: National ID (specimen)
    value: A234567890
    label: Number on the official specimen ID card (樣本, 陳筱玲)
    status: published-example
    fails_checks: [tw-national-id]
    notes: Fails the check digit (correct would be A234567893), apparently deliberately — official and obviously fake.
    sources:
      - title: 國民身分證真偽辨識資料 (specimen image)
        url: https://www.ris.gov.tw/documents/html/apply-idCard/189.html
        publisher: Ministry of the Interior, Department of Household Registration
        accessed: 2026-11-05

