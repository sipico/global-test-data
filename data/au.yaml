  - id: au-postcode-unused
    category: address
    type: Postcode range
    kind: range
    value: 00xx, 01xx, 03xx-07xx, 19xx, 49xx, 75xx-79xx, 86xx, 88xx, 89xx, 91xx-93xx, 95xx, 96xx, 98xx; also 1000 and 0999
    label: Postcodes not used by any locality (first two digits)
    status: derived
    verified: ["Checked against the community dataset matthewproctor/australianpostcodes, 3,175 postcodes (2026-11-05); not an official Australia Post file"]
    notes: Such postcodes pass a 4-digit format check but fail any check that the postcode exists. Never use 9999 (North Pole VIC).
