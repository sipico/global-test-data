  # --- Address ----------------------------------------------------------------
  - id: au-address-auspost-private
    category: address
    type: Address example (private person)
    kind: placeholder
    value: "Ms A Citizen / 3 Example Street / PARKVILLE VIC 3052"
    label: Australia Post's own example of a private address
    status: published-example
    notes: Invented person at a real locality. Max. 40 characters per line, no punctuation, last line LOCALITY STATE POSTCODE in capitals (AS 4590-1999).
    sources: &auspost
      - title: Australia Post — Correct addressing
        url: https://auspost.com.au/content/dam/auspost_corp/media/documents/correct-addressing.pdf
        publisher: Australia Post
        accessed: 2026-11-05
  - id: au-address-auspost-company
    category: address
    type: Address example (company, floor)
    kind: placeholder
    value: "Mr C.R. MacDonald AO / Manager / Orbit Travel Co / Travel World House / Level 7 17 Jones St / NORTH SYDNEY NSW 2060"
    label: Australia Post's example of a company address in a building
    status: published-example
    notes: The same standard has Ms C. Fitzgerald / William Jones Pty Ltd / Level 6 51 Jacobson St / BRISBANE QLD 4000.
    sources: &auspost1999
      - title: Australia Post — Address Presentation Standards (1999)
        url: https://auspost.com.au/content/dam/auspost_corp/media/documents/australia-post-addressing-standards-1999.pdf
        publisher: Australia Post
