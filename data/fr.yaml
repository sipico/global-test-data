code: FR
name: France
native_name: France
region: Europe
languages: [fr, en]
updated: 2026-11-05
research: research/example-identifiers-fr.md
summary: >
  France has the best official source of fictitious company identifiers found so far:
  the FNFE-MPE example invoices for the national e-invoicing reform use SIRENs that pass
  the check digit and are not in the company register. The telecoms regulator ARCEP
  reserves six phone number blocks for fiction. There are no fictitious towns or
  postcodes: La Poste's own examples put invented people and companies at real communes.

identifiers:
  - name: SIREN
    format: 9 digits
    check: fr-siren
    authority: INSEE
    ubl: ["cac:PartyLegalEntity/cbc:CompanyID @schemeID=0002", "cbc:EndpointID @schemeID=0002"]
  - name: SIRET
    format: SIREN + 5-digit establishment number (NIC), 14 digits
    check: fr-siret
    authority: INSEE
    ubl: ["cac:PartyIdentification/cbc:ID @schemeID=0009"]
  - name: VAT number (numéro de TVA intracommunautaire)
    format: FR + 2-digit key + SIREN
    check: fr-vat
    authority: DGFiP
    notes: Key = (12 + 3 × (SIREN mod 97)) mod 97. A made-up SIREN gives a VAT number that passes syntax checks but fails a live VIES lookup.
    ubl: ["cac:PartyTaxScheme/cbc:CompanyID"]
  - name: EORI number
    format: FR + SIRET (or SIREN)
    authority: Direction générale des douanes et droits indirects
  - name: E-invoicing electronic address
    format: SIREN, optionally with a suffix
    authority: DGFiP (Annuaire)
    ubl: ["cbc:EndpointID @schemeID=0225"]

