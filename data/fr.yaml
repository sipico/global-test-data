  # --- Address ----------------------------------------------------------------
  - id: fr-address-laposte-private
    category: address
    type: Address example (private person)
    kind: placeholder
    value: "Monsieur Jean DELORME / Appartement 2 / ENTREE A BATIMENT JONQUILLE / 25 RUE DE L'EGLISE / CAUDOS / 33380 MIOS"
    label: La Poste's own example of a correctly formatted private address
    status: published-example
    notes: Invented person at a real commune (Mios, Gironde). Lines in AFNOR NF Z10-011 order, max. 38 characters each.
    sources: &laposte
      - title: La Poste SP 8855 vol. 2 v1.11 — Adressage des plis
        url: https://lastation.laposte.fr/sites/p8_u1/files/2023-03/SP8855-Volume%202_V1.11%20-%20Adressage%20des%20plis.pdf
        publisher: La Poste
        accessed: 2026-11-05
  - id: fr-address-laposte-company
    category: address
    type: Address example (company)
    kind: placeholder
    value: "Société DUPONT / Monsieur Martin Service Achats / ZONE INDUSTRIELLE OUEST / 35 IMPASSE DES GABARRES / BP 18 ARVEYRES / 33506 LIBOURNE CEDEX"
    label: La Poste's own example of a company address with PO box and CEDEX
    status: published-example
    sources: *laposte
  - id: fr-postcode-unused-00
    category: address
    type: Postcode range
    kind: range
    value: 00xxx, 96xxx, 99xxx
    label: First two digits not used by any geographic postcode
    status: derived
    verified: ["Checked against La Poste's Base officielle des codes postaux, 6,328 postcodes (2026-11-05); CEDEX codes not checked"]
    notes: Such postcodes pass a 5-digit format check but fail any check that the postcode exists. 75000 is also not a real postcode.
    sources:
      - title: Base officielle des codes postaux (laposte-hexasmal)
        url: https://www.data.gouv.fr/datasets/base-officielle-des-codes-postaux
        publisher: La Poste
        accessed: 2026-11-05
  - id: fr-town-ma-ville
    category: address
    type: Town name
    value: MA VILLE
    label: Invented town name used in the official e-invoicing examples
    status: published-example
    verified: ["Not a commune name in La Poste's postcode file (2026-11-05)"]
    notes: Used with the real postcode 06000. TRIFOUILLIS LES OIES and PERPETTE LES OIES are also not communes and are recognisable French joke names.
    sources: *fnfe

